name: Update content order

on:
  push:
    branches:
      - main
    paths:
      - "markdown/**/*.md"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Record first commit times
        run: node scripts/update-order-ledger.mjs

      - name: Save changed order
        run: |
          if git diff --quiet -- data/content-order.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/content-order.json
          git commit -m "Update document order"
          git push
